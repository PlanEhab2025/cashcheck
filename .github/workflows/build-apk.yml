name: Build APK
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
      - run: curl -sL -o src.zip https://github.com/PlanEhab2025/cashcheck/releases/download/source-v1.4.0/5-cashcheck_repo_v152d.zip && unzip -oq src.zip
      - run: cp proj/android/gradle.properties.github proj/android/gradle.properties
      - run: cd proj && flutter pub get && flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - name: Rename APK with version
        run: cd proj && VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1) && cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/cashcheck-$VER.apk" && echo "APK_PATH=proj/build/app/outputs/flutter-apk/cashcheck-$VER.apk" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.2
          name: CashCheck v1.5.2
          files: ${{ env.APK_PATH }}

name: Build APK
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
      - run: curl -sL -o src.zip https://github.com/PlanEhab2025/cashcheck/releases/download/source-v1.4.0/3-cashcheck_repo_v141.zip && unzip -oq src.zip
      - run: cp proj/android/gradle.properties.github proj/android/gradle.properties
      - run: cd proj && flutter pub get && flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: CashCheck v1.4.1
          files: proj/build/app/outputs/flutter-apk/app-release.apk
